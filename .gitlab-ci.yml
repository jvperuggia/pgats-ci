# .gitlab-ci.yml
# Pipeline manual para execução de testes E2E com Playwright

stages:
  - test

e2e_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.44.0-jammy # imagem oficial Playwright
  script:
    # Instala dependências do projeto
    - yarn install
    # Instala browsers do Playwright (já vem na imagem, mas garante atualização)
    - npx playwright install
    # Executa os testes E2E
    - npx playwright test
  when: manual
  artifacts:
    when: always
    paths:
      - playwright-report # relatório HTML
      - test-results.xml # relatório JUnit
