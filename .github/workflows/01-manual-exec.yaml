# CI de nível 01 - Disparo manual através de clique

#nome da pipeline
name: 'Execução Manual'

#gatilhos ou Triggers - regras de disparo
#gatilho manual = workflow dispatch

on:
    workflow_dispatch: 

#tarefas dentro da pipeline = jobs
jobs:
    # nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        #passos do job
        steps:
          #clone do projeto
          - uses: actions/checkout@v4

         #instalação do node
          - uses: actions/setup-node@v4
            with:
              node-version: 24.x 

         # instalação do Yarn
          - name: Instalando Yarn
            run: npm install -g yarn

         #instalação das dependencias
          - name: Instalando dependencias
            run: yarn

         # instalação dos brownsers do playwright
          - name: Instalando brownsers do playwright
            run: yarn playwright install

         # execitar os testes e2e
          - name: executando testes e2e
            run: yarn run e2e
